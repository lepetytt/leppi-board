<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A working dashboard, not a page for search engines. Remove this line to let them in. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>leppi-board</title>
    <script>
      // The theme is set before the first paint, otherwise a dark page flashes light.
      // Dark by default; light only if the person switched to it.
      {
      let dark = true
      try {
        const saved = localStorage.getItem("theme")
        if (saved) dark = saved === "dark"
      } catch {}
      document.documentElement.classList.toggle("dark", dark)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
